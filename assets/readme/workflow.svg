<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Meta 主图制作流程</title>
  <desc id="desc">准备产品图、Logo 和指定官网链接；核实三个俄语卖点并本地排版预览；由用户明确锁定母版，再生成 SKU。</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#F4F8FC"/><stop offset="1" stop-color="#E3EFF8"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#246283" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="450" rx="24" fill="url(#surface)"/>
  <path d="M0 390 Q460 230 1200 410 V450 H0Z" fill="#FFFFFF" opacity=".55"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="48" y="76" font-size="44" font-weight="600" fill="#182A35">一张主图的制作流程</text>
    <g fill="#FFFFFF">
      <rect x="48" y="116" width="336" height="284" rx="20"/>
      <rect x="432" y="116" width="336" height="284" rx="20"/>
      <rect x="816" y="116" width="336" height="284" rx="20"/>
    </g>
    <g fill="#246283" font-size="28" font-weight="600">
      <text x="80" y="164">01 / INPUT</text><text x="464" y="164">02 / PREVIEW</text><text x="848" y="164">03 / MASTER</text>
    </g>
    <g fill="#182A35" font-size="46" font-weight="600">
      <text x="80" y="234">准备素材</text><text x="464" y="234">本地预览</text><text x="848" y="234">锁定母版</text>
    </g>
    <g fill="#475B69" font-size="36">
      <text x="80" y="300">产品图 + Logo</text><text x="80" y="354">指定官网链接</text>
      <text x="464" y="300">核实三个卖点</text><text x="464" y="354">自动排版合成</text>
      <text x="848" y="300">用户明确确认</text><text x="848" y="354">继续生成 SKU</text>
    </g>
  </g>
  <g fill="none" stroke="#246283" stroke-width="3" marker-end="url(#arrow)">
    <path d="M392 258 H420"/><path d="M776 258 H804"/>
  </g>
</svg>
